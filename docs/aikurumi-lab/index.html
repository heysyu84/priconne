<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>냥냥클랜 · 외부 택틱 검토실 (실험용)</title>
<style>
:root{color-scheme:dark;--bg:#0b111c;--surface:#151e2d;--surface2:#1d293d;--line:#354157;--ink:#edf2ff;--muted:#a6b4cd;--accent:#a9bdf9;--warn:#ffc88b;--green:#94dcb9}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}main{max-width:1220px;margin:auto;padding:30px 20px 70px}
header{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:20px}header h1{font-size:1.65rem;letter-spacing:-.03em;margin:0 0 6px}p{margin:.25rem 0 1rem}.muted,small{color:var(--muted)}.label{display:block;color:var(--muted);font-size:.78rem;font-weight:650;margin-bottom:6px}.badge{font-size:.73rem;border:1px solid var(--line);border-radius:25px;padding:4px 10px;color:var(--muted);white-space:nowrap}
.notice{border:1px solid #627499;background:#1a2942;padding:13px 16px;border-radius:12px;margin-bottom:16px}.notice strong{color:var(--accent)}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin-bottom:15px}select,input{background:var(--surface2);color:var(--ink);border:1px solid var(--line);border-radius:9px;padding:9px 12px;min-height:42px;max-width:100%;font:inherit}
input{min-width:210px}select{min-width:168px}.panes{display:grid;grid-template-columns:minmax(280px,.85fr) minmax(0,1.55fr);gap:14px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}.panel>h2,.panel-title{font-size:1rem;margin:0;padding:14px 16px;border-bottom:1px solid var(--line)}.list{max-height:73vh;overflow:auto}.item{width:100%;border:0;border-bottom:1px solid var(--line);display:block;text-align:left;background:none;color:inherit;font:inherit;padding:13px 15px;cursor:pointer}.item:hover,.item.selected{background:#273858}.item:last-child{border-bottom:0}.item-title{display:flex;gap:10px;align-items:center;justify-content:space-between;font-weight:700}.item small{display:block;margin-top:4px}.review{color:var(--warn)}.ok{color:var(--green)}
.detail{padding:16px;min-height:420px}.detail h2{margin:0;font-size:1.22rem}.data-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:15px 0}.stat{border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:11px 12px}.stat strong{display:block;word-break:break-word}
.party{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin:12px 0}.party>div{padding:9px 4px;text-align:center;border-radius:9px;background:var(--surface2);border:1px solid var(--line)}.party strong{display:block;font-size:.85rem;overflow-wrap:anywhere}
.step{border-top:1px solid var(--line);padding:9px 0}.step header{margin:0;display:flex;align-items:flex-start;gap:8px;justify-content:space-between}.step-text{overflow-wrap:anywhere;font-size:.89rem}.state{white-space:nowrap;font:700 .7rem/1.6 ui-monospace,SFMono-Regular,monospace;color:#6a748a}.state .on{color:var(--green)}pre{white-space:pre-wrap;overflow-wrap:anywhere;max-height:400px;overflow:auto;border:1px solid var(--line);padding:14px;border-radius:10px;background:#0b1525;font:13px/1.7 ui-monospace,SFMono-Regular,monospace}
summary{cursor:pointer;font-weight:700;margin:12px 0}a{color:var(--accent)}.warnings{background:#352a24;border:1px solid #7e604c;border-radius:10px;padding:13px 16px;overflow-wrap:anywhere}.empty{padding:24px 16px;color:var(--muted)}
@media(max-width:760px){main{padding:18px 12px 50px}.panes{grid-template-columns:minmax(0,1fr)}.list{max-height:280px}.data-grid{grid-template-columns:1fr}.party strong{font-size:.73rem}header h1{font-size:1.35rem}}
</style></head><body><main>
<header><div><h1>외부 택틱 검토실</h1><p class="muted">냥냥클랜 · aikurumi 수동 수집 기능의 독립 검증 화면</p></div><span class="badge">TEST / 읽기 전용</span></header>
<div class="notice"><strong>운영 사이트와 완전히 분리</strong> · 수집 자료는 검토 전용입니다. 기존 택틱을 수정하거나 추천조합에 등록할 수 없습니다.</div>
<div class="toolbar">
<label><span class="label">한섭 / 일섭 / 단계</span><select id="month" disabled><option>자료 읽는 중</option></select></label>
<label><span class="label">보스</span><select id="boss"><option value="all">전체 보스</option></select></label>
<label><span class="label">검토 상태</span><select id="filter"><option value="all">전체</option><option value="timeline">조작문 있음</option><option value="clean">경고 없음</option><option value="warning">확인 필요</option><option value="notes">메모만 있음</option></select></label>
<label><span class="label">캐릭터명·원본 검색</span><input id="search" placeholder="캐릭터 / 보스 / ID 검색"></label>
</div>
<div class="panes"><section class="panel"><h2 class="panel-title" id="list-title">수집된 자료</h2><div class="list" id="list"><p class="empty">자료 읽는 중…</p></div></section><section class="panel"><h2 class="panel-title">원본과 한국어 변환 비교</h2><div class="detail" id="detail"><p class="muted">왼쪽에서 택틱을 선택하세요.</p></div></section></div>
</main><script type="module" src="./aikurumi-lab.mjs"></script></body></html>
