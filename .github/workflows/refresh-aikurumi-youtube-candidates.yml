name: Refresh YouTube tactic review data
on:
  push:
    branches: ['main', 'test/aikurumi-api-probe-20261030']
    paths:
      - '.github/workflows/refresh-aikurumi-youtube-candidates.yml'
      - 'redive/scripts/refresh-aikurumi-youtube-candidates.mjs'
      - 'redive/scripts/aikurumi-youtube-candidates.mjs'
      - 'redive/scripts/test-aikurumi-youtube-candidates.mjs'
      - 'redive/public/aikurumi-snapshot*.json'
      - 'redive/public/aikurumi-tactic-*.mjs'
      - 'redive/public/aikurumi-review-model.mjs'
  workflow_dispatch:
  schedule:
    - cron: '20 23 * * *'
permissions:
  contents: write
concurrency:
  group: youtube-review-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      REVIEW_BRANCH: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test conservative multi-boss matching and no-description publication
        run: |
          node --check redive/scripts/aikurumi-youtube-candidates.mjs
          node --check redive/scripts/refresh-aikurumi-youtube-candidates.mjs
          node --test redive/scripts/test-aikurumi-youtube-candidates.mjs
      - name: Fetch 3+4 stage descriptions and build derived previews only
        run: node redive/scripts/refresh-aikurumi-youtube-candidates.mjs
      - name: Reject accidental raw API data in generated public bundle
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const p='redive/public/aikurumi-youtube-candidates.json';
          const data=JSON.parse(fs.readFileSync(p,'utf8'));
          if(data.schema!=='nyang-youtube-tactic-candidates-v1')throw Error('Invalid export schema');
          if(data.registrationAllowed!==false||data.readOnly!==true)throw Error('Read-only safety lost');
          for(const item of data.references){
            if(Object.hasOwn(item,'description')||Object.hasOwn(item,'sourceText')||Object.hasOwn(item,'notes'))throw Error('Raw description leaked');
            for(const row of item.rows){
              if(Object.hasOwn(row,'source')||Object.hasOwn(row,'raw'))throw Error('Raw source leaked');
            }
          }
          if(fs.readFileSync(p,'utf8')!==fs.readFileSync('docs/aikurumi-lab/aikurumi-youtube-candidates.json','utf8'))
            throw Error('Published mirror differs');
          console.log('DERIVED_ONLY_OK',JSON.stringify({references:data.references.length,statuses:data.statuses,expiresAt:data.expiresAt}));
          NODE
      - name: Publish refreshed review data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add redive/public/aikurumi-youtube-candidates.json docs/aikurumi-lab/aikurumi-youtube-candidates.json docs/compact/aikurumi-youtube-candidates.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: refresh YouTube tactic review candidates'
            git pull --rebase origin "$REVIEW_BRANCH"
            git push origin "HEAD:$REVIEW_BRANCH"
          fi
