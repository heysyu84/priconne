name: Verify external tactic review workspace
on:
  push:
    branches: [main, test/aikurumi-api-probe-20261030]
    paths:
      - .github/workflows/verify-aikurumi-preview.yml
      - docs/aikurumi-lab/**
      - docs/compact/aikurumi-*
      - docs/compact/app.js
      - redive/public/aikurumi-*
      - redive/public/legacy-codec.mjs
      - redive/src/external-review.js
      - redive/src/usability.js
      - redive/scripts/test-aikurumi-*
      - redive/scripts/test-tactic-set-state.mjs
      - redive/public/tactic-set-state.mjs
      - redive/public/compat/tactics-model.mjs
      - docs/compact/tactic-set-state.mjs
      - docs/compact/compat/tactics-model.mjs
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify source priority, conditions, administrator imports and production round trips
        run: |
          node --check docs/compact/app.js
          node --check redive/public/aikurumi-review-ui.mjs
          node --check redive/public/aikurumi-review-model.mjs
          node --test redive/scripts/test-aikurumi-*.mjs redive/scripts/test-stage3-recommendations.mjs redive/scripts/test-tactic-set-state.mjs
          node redive/scripts/check-tactic-body-save.mjs
          node redive/scripts/check-usability.mjs
          node redive/scripts/check-shared-client.mjs
          node redive/scripts/check-migration.mjs
      - name: Verify deployed assets
        env:
          REVIEW_BRANCH: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const origin=process.env.REVIEW_BRANCH==='main'?'https://priconne.pages.dev':'https://test-aikurumi-api-probe-2026.priconne.pages.dev';
          async function verify(path,check){
            let last;
            for(let n=0;n<10;n++){
              try{
                const response=await fetch(origin+path,{cache:'no-store',signal:AbortSignal.timeout(12000)});
                assert.equal(response.status,200);check(await response.text());console.log('DEPLOYED_OK',path);return;
              }catch(error){last=error;await new Promise(r=>setTimeout(r,6000));}
            }
            throw last;
          }
          await verify('/',text=>assert.match(text,/20261030-except01/));
          await verify('/aikurumi-lab/',text=>{assert.match(text,/aikurumi-review\.css/);assert.doesNotMatch(text,/TEST \/ 읽기 전용|API 수집/);});
          await verify('/compact/aikurumi-review-ui.mjs',text=>assert.match(text,/createExternalReview/));
          await verify('/compact/aikurumi-review-model.mjs',text=>assert.match(text,/buildReviewedTactic/));
          await verify('/compact/aikurumi-youtube-candidates.json',text=>{
            const data=JSON.parse(text);assert.equal(data.schema,'nyang-youtube-tactic-candidates-v1');
            assert.ok(data.references.length>0);assert.ok(data.references.every(r=>!Object.hasOwn(r,'description')));
          });
          NODE
