name: Probe Aikurumi JP public tactic API (isolated)
on:
  push:
    branches: ['test/aikurumi-api-probe-20261030']
    paths:
      - '.github/workflows/probe-aikurumi.yml'
      - 'redive/public/tactic-parser.mjs'
      - 'redive/scripts/test-aikurumi-tactic-parser.mjs'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read public API only - no write, no deployment
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import {createHash} from 'node:crypto';
          import {convertForeignTactic} from './redive/public/tactic-parser.mjs';
          const root='https://aikurumi.cn/api';
          const token=()=>{const d=String(Date.now());const l=Math.random()*d.length;const t=createHash('sha1').update(d.substr(l)+'123456').digest('hex');return {d,l:String(l),t,'Accept':'application/json','Content-Type':'application/json','User-Agent':'NyangClanTacticProbe/0.1'};};
          async function call(path,body){
            try{
              const response=await fetch(root+path,{method:body?'POST':'GET',headers:token(),body:body?JSON.stringify(body):undefined,signal:AbortSignal.timeout(18000)});
              console.log('ENDPOINT',path,'HTTP',response.status,'type',response.headers.get('content-type'));
              const raw=await response.text();
              let json;try{json=JSON.parse(raw)}catch{console.log('NONJSON_RESPONSE',raw.length,raw.slice(0,140).replace(/</g,'&lt;'));return null}
              console.log('ENVELOPE',JSON.stringify({code:json.code,hasData:'data' in json,dataType:Array.isArray(json.data)?'array':typeof json.data,dataCount:Array.isArray(json.data)?json.data.length:null,msg:json.msg}));
              return response.ok&&json.code===200?json.data:null;
            }catch(error){console.log('REQUEST_ERROR',path,error.name,error.message);return null;}
          }
          const periods=await call('/pcr/clanBattleList?server=jp');
          console.log('PERIOD_SAMPLE',JSON.stringify(Array.isArray(periods)?periods.slice(0,4):null));
          const parseMonth=v=>{const raw=String(v??'');const m=raw.match(/^(\d{4})[-/](\d{1,2})/);if(m)return m[1]+'-'+m[2].padStart(2,'0');const n=Number(v);if(Number.isFinite(n)&&n>1e9){const d=new Date(n<1e12?n*1000:n);return d.toISOString().slice(0,7)}return null;};
          const sample=Array.isArray(periods)?periods.find(x=>parseMonth(x.startTime)==='2025-10'):null;
          const battleId=Number(sample?.clanBattleId||1093);
          console.log('PERIOD',JSON.stringify({found:!!sample,clanBattleId:battleId,startTime:sample?.startTime||null}));
          let success=0;
          for(const stage of [1,3,6]){
            const data=await call('/pcr/gvgTask',{server:'jp',clanBattleId:battleId,stage});
            if(Array.isArray(data)){
              success++;
              const bosses=data.map(b=>({index:b.index,name:b.unitName,bossId:b.prefabId,tactics:Array.isArray(b.tasks)?b.tasks.length:0}));
              const first=data.flatMap(b=>b.tasks||[])[0];
              const link=first?.links?.[0];
              console.log('STAGE',stage,'BOSSES',JSON.stringify(bosses));
              const tasks=data.flatMap(b=>b.tasks||[]);const links=tasks.flatMap(t=>t.links||[]);const timeline=links.filter(l=>String(l.remarks||'').trim());
              console.log('CONTENT_STATS',stage,JSON.stringify({tasks:tasks.length,withFiveCharacters:tasks.filter(t=>t.charas?.length===5).length,withDescription:tasks.filter(t=>String(t.remarks||'').trim()).length,withWarning:tasks.filter(t=>String(t.exRemarks||'').trim()).length,withLinks:tasks.filter(t=>(t.links||[]).length>0).length,totalLinks:links.length,linksWithTimeline:timeline.length,tasksWithTimeline:tasks.filter(t=>(t.links||[]).some(l=>String(l.remarks||'').trim())).length,withManualDamage:tasks.filter(t=>Number(t.damage)>0).length,withAutoDamage:tasks.filter(t=>Number(t.autoDamage)>0).length,withHalfAutoDamage:tasks.filter(t=>Number(t.halfAutoDamage)>0).length,carryTypes:tasks.filter(t=>t.type===1).length}));
              if(stage===6){const selection=tasks.filter(t=>(t.links||[]).some(l=>String(l.remarks||'').trim()));const audit={candidates:selection.length,parsed:0,withWarning:0,unmapped:0,empty:0,exceptions:0,totalRows:0,missingFiveCharacters:0};for(const t of selection){if(t.charas?.length!==5)audit.missingFiveCharacters++;try{const raw=(t.links||[]).find(l=>String(l.remarks||'').trim())?.remarks||'';const parsed=convertForeignTactic(raw,t.charas?.map(c=>c.unitName)||[],[],data.map(b=>b.unitName),[]);audit.parsed++;audit.totalRows+=parsed.rows.length;if(parsed.warnings.length)audit.withWarning++;if(parsed.unmappedActors.length)audit.unmapped++;if(!parsed.rows.length)audit.empty++;if(parsed.rows.some(r=>!Array.isArray(r.checked)||r.checked.length!==6||r.checked.some(v=>typeof v!=='boolean')))throw Error('Invalid state')}catch(error){audit.exceptions++;console.log('AUDIT_ERROR',String(t.id),error.message)}}console.log('FULL_AUDIT',JSON.stringify(audit));}
              console.log('SAMPLE_CHARACTERS',stage,JSON.stringify(first?.charas?.map(c=>({prefabId:c.prefabId,unitName:c.unitName,currentRarity:c.currentRarity,rarity:c.rarity,rank:c.rank}))||[]));
              console.log('SAMPLE_TIMELINE',stage,JSON.stringify(timeline[0]?{name:timeline[0].name,text:String(timeline[0].remarks).slice(0,220),video:String(timeline[0].link||'').slice(0,120)}:null));
              if(stage===6&&timeline[0]){const converted=convertForeignTactic(String(timeline[0].remarks),['란파','수에키드나','프캬루','호마레','바이올렛'],['兰法龙','','黑猫','','紫罗兰'],data.map(b=>b.unitName),[]);console.log('CONVERSION_SAMPLE',JSON.stringify({rows:converted.rows.length,warnings:converted.warnings.slice(0,5),unmappedActors:converted.unmappedActors.slice(0,5),text:converted.text.slice(0,650)}));}
              console.log('TACTIC_FIELDS',stage,JSON.stringify(first?{keys:Object.keys(first),partySize:first.charas?.length,hasRemarks:!!first.remarks,hasVideo:!!link?.link,hasTimeline:!!link?.remarks,types:first.canAuto,damage:first.damage,autoDamage:first.autoDamage,halfAutoDamage:first.halfAutoDamage,linkFields:link?Object.keys(link):[]}:null));
            }
            await new Promise(r=>setTimeout(r,400));
          }
          for(const [method,path,headers] of [['GET','/pcr/clanBattleList?server=jp',{'Origin':'https://priconne.pages.dev'}],['OPTIONS','/pcr/gvgTask',{'Origin':'https://priconne.pages.dev','Access-Control-Request-Method':'POST','Access-Control-Request-Headers':'content-type,d,l,t'}]]){try{const res=await fetch(root+path,{method,headers,signal:AbortSignal.timeout(12000)});console.log('CORS',JSON.stringify({method,status:res.status,allowOrigin:res.headers.get('access-control-allow-origin'),allowMethods:res.headers.get('access-control-allow-methods'),allowHeaders:res.headers.get('access-control-allow-headers')}))}catch(error){console.log('CORS_ERROR',method,error.message)}}
          console.log('RESULT',JSON.stringify({periods:Array.isArray(periods)?periods.length:0,successfulStages:success}));
          if(!Array.isArray(periods)||!success)process.exitCode=1;
          NODE

      - name: Check parser against real source regression cases
        run: node --test redive/scripts/test-aikurumi-tactic-parser.mjs
